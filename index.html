<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Свадебное Мини-Приложение</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <div class="content-area" id="main-content-area">
        <div class="content-section" id="section1">
            Загрузка...
        </div>
        <div class="content-section countdown-section" id="countdown">
            <div class="countdown-item">
                <span id="days">00</span>
                <div class="label">Дни</div>
            </div>
            <div class="countdown-item">
                <span id="hours">00</span>
                <div class="label">Часы</div>
            </div>
            <div class="countdown-item">
                <span id="minutes">00</span>
                <div class="label">Минуты</div>
            </div>
            <div class="countdown-item">
                <span id="seconds">00</span>
                <div class="label">Секунды</div>
            </div>
        </div>
        <div class="content-section" id="section3">
            Загрузка...
        </div>
    </div>
    <button class="action-button" id="confirmButton">Я приду</button>

    <div class="menu-buttons" id="menu-buttons-area" style="display: none;">
        <button class="menu-button" id="inviteButton">Приглашение</button>
        <button class="menu-button" id="rulesButton">Правила</button>
        <button class="menu-button" id="questButton">Квест</button>
        <button class="menu-button disabled" id="seatingButton" disabled>Рассадка</button>
    </div>

    <div class="screen" id="rules-screen" style="display: none;">
        <div class="screen-content">
            <h2>Правила</h2>
            <p>Здесь будут правила.</p>
            <button class="action-button back-button" id="rulesBackButton">Назад</button>
        </div>
    </div>

    <div class="screen" id="quest-screen" style="display: none;">
        <div class="screen-content">
            <h2>Квест</h2>
            <div class="quest-menu-buttons">
                <button class="menu-button" id="tasksButton">Задания</button>
                <button class="menu-button" id="quizButton">Квиз</button>
            </div>
            <button class="action-button back-button" id="questBackButton">Назад</button>
        </div>
    </div>

    <div class="screen" id="tasks-screen" style="display: none;">
        <div class="screen-content">
            <h2>Задания</h2>
            <p>Здесь будут задания. Пока в разработке!</p>
            <button class="action-button back-button" id="tasksBackButton">Назад</button>
        </div>
    </div>

    <div class="screen" id="quiz-screen" style="display: none;">
        <div class="screen-content">
            <h2 id="quizQuestion">Загрузка вопроса...</h2>
            <input type="text" id="quizAnswerInput" placeholder="Ваш ответ" class="quiz-input">
            <button class="action-button" id="submitQuizAnswer">Отправить ответ</button>
            <button class="action-button back-button" id="quizBackButton">Назад</button>
        </div>
    </div>

    <div id="popup-message" class="popup" style="display: none;">
        <div class="popup-content">
            <p id="popupText"></p>
            <button class="action-button" id="popupOkButton">ОК</button>
        </div>
    </div>

</div>
<div id="debug-output"></div> <script type="module" src="js/debug.js"></script>
<script type="module" src="js/ui.js"></script>
<script type="module" src="js/api.js"></script>
<script type="module" src="js/handlers.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
