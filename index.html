<!-- telegram-mini-app/index.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Telegram Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
  <pre id="debug-log" style="white-space: pre-wrap; font-size: 12px;"></pre>
</head>
<body>
  <h2 class="testHeader">Добро пожаловать!</h2>
  <button onclick="sendData()">Отправить данные</button>

<script>
  function log(message) {
    document.getElementById("debug-log").textContent += message + "\n";
  }

  log("Запуск WebApp");

  const tg = window.Telegram.WebApp;
  tg.expand();

  log("tg.initDataUnsafe: " + JSON.stringify(tg.initDataUnsafe));

  function sendData() {
    const user = tg.initDataUnsafe.user;

    if (!user) {
      log("Пользователь не определён.");
      return;
    }

    log("Отправляем данные: " + JSON.stringify(user));

    fetch("sovaint.ru/api/telegram-user", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        id: user.id,
        first_name: user.first_name,
        last_name: user.last_name,
        username: user.username
      })
    })
            .then(res => res.text())
            .then(text => {
              log("Ответ от сервера: " + text);
            })
            .catch(err => {
              log("Ошибка fetch: " + err);
            });
  }

</script>

</body>
</html>
