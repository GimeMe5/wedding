<!-- telegram-mini-app/index.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Telegram Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
  <pre id="debug-log" style="white-space: pre-wrap; font-size: 12px;"></pre>
</head>
<body>
  <h2 class="testHeader">Добро пожаловать!</h2>
  <button onclick="sendData()">Отправить данные</button>

<script>
  function log(message) {
    document.getElementById("debug-log").textContent += message + "\n";
  }

  log("Запуск WebApp6");

  const tg = window.Telegram.WebApp;
  tg.expand();

  log("tg.initDataUnsafe: " + JSON.stringify(tg.initDataUnsafe));
  log("tg.initData: " + JSON.stringify(tg.initData));

  function sendData() {
    const user = tg.initDataUnsafe.user;

    if (!user) {
      log("Пользователь не определён.");
      return;
    }

    fetch("https://sovaint.ru:8443/api/telegram-user", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Telegram-InitData": tg.initData
      },
      body: JSON.stringify({
        user: tg.initDataUnsafe.user
      })
    });

  }

</script>

</body>
</html>
