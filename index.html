<!DOCTYPE html>
<html>
<head>
  <title>Wedding Invite</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <h2 id="greeting">Привет!</h2>
  <p>Мы приглашаем тебя на нашу свадьбу 🎉</p>
  <p>До начала осталось:</p>
  <div class="timer" id="countdown">--:--:--</div>
  <button onclick="confirmAttendance()">Я приду</button>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();

  const user = tg.initDataUnsafe.user;
  document.getElementById("greeting").textContent = `Дорогой(ая) ${user.first_name},`;

  function confirmAttendance() {
    fetch("https://sovaint.ru:8443/api/rsvp", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Telegram-InitData": tg.initData
      },
      body: JSON.stringify({ user })
    });
    tg.showPopup({ message: "Спасибо! Ждём тебя 🎊" });
  }

  // Countdown to wedding date
  const deadline = new Date("2025-08-14T15:00:00+03:00"); // 15:00 МСК

  function updateCountdown() {
    const now = new Date();
    const diff = deadline - now;

    if (diff <= 0) {
      document.getElementById("countdown").textContent = "⏳ Свадьба уже началась!";
      return;
    }

    const seconds = Math.floor(diff / 1000) % 60;
    const minutes = Math.floor(diff / (1000 * 60)) % 60;
    const hours = Math.floor(diff / (1000 * 60 * 60)) % 24;
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));

    document.getElementById("countdown").textContent =
            `Осталось ${days} дней ${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
  }

  function pad(n) {
    return n.toString().padStart(2, '0');
  }

  setInterval(updateCountdown, 1000);
  updateCountdown();

</script>
</body>
</html>
